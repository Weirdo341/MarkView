<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: https: http:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'" />
  <title>MarkView</title>
  <link rel="stylesheet" href="../../dist/renderer.css" />
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <div class="toolbar-left">
        <button id="btn-sidebar" class="tool-btn" title="大纲侧栏 (Ctrl+Shift+L)">
          <svg viewBox="0 0 16 16" width="16" height="16"><path fill="currentColor" d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75ZM1.75 12h12.5a.75.75 0 0 1 0 1.5H1.75a.75.75 0 0 1 0-1.5Z"/></svg>
        </button>
        <button id="btn-open" class="tool-btn" title="打开文件 (Ctrl+O)">
          <svg viewBox="0 0 16 16" width="16" height="16"><path fill="currentColor" d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75Z"/></svg>
        </button>
      </div>
      <div id="file-title" title="MarkView">MarkView</div>
      <div class="toolbar-right">
        <button id="btn-wide" class="tool-btn" title="宽屏视图">
          <svg viewBox="0 0 16 16" width="16" height="16"><path fill="currentColor" d="M1.75 1h4.5a.75.75 0 0 1 0 1.5H3.56l3.22 3.22a.75.75 0 1 1-1.06 1.06L2.5 3.56v2.69a.75.75 0 0 1-1.5 0v-4.5A.75.75 0 0 1 1.75 1Zm12.5 14h-4.5a.75.75 0 0 1 0-1.5h2.69l-3.22-3.22a.75.75 0 1 1 1.06-1.06l3.22 3.22V9.75a.75.75 0 0 1 1.5 0v4.5a.75.75 0 0 1-.75.75Z"/></svg>
        </button>
        <button id="btn-edit" class="tool-btn" title="源码模式 (Ctrl+E)">
          <svg viewBox="0 0 16 16" width="16" height="16"><path fill="currentColor" d="M13.06 1.94a1.5 1.5 0 0 1 2.12 2.12l-8.7 8.7a1.5 1.5 0 0 1-.66.39l-2.6.74a.5.5 0 0 1-.62-.62l.74-2.6a1.5 1.5 0 0 1 .39-.66l8.7-8.7Zm1.06 1.06a.5.5 0 0 0-.7 0l-.9.9.7.7.9-.9a.5.5 0 0 0 0-.7Zm-1.66 1.66-.7-.7-7.64 7.64a.5.5 0 0 0-.13.22l-.45 1.58 1.58-.45a.5.5 0 0 0 .22-.13l7.12-7.16Z"/></svg>
        </button>
        <button id="btn-search" class="tool-btn" title="查找 (Ctrl+F)">
          <svg viewBox="0 0 16 16" width="16" height="16"><path fill="currentColor" d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.5 4.5 0 1 0-9 0 4.5 4.5 0 0 0 9 0Z"/></svg>
        </button>
        <button id="btn-theme" class="tool-btn" title="切换主题">
          <svg viewBox="0 0 16 16" width="16" height="16"><path fill="currentColor" d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM1.5 8a6.5 6.5 0 0 1 13 0 6.5 6.5 0 0 1-13 0Zm4.879-2.773 4.264 2.559a.25.25 0 0 1 0 .428l-4.264 2.559A.25.25 0 0 1 6 10.559V5.44a.25.25 0 0 1 .379-.213Z"/></svg>
        </button>
        <button id="btn-image" class="tool-btn" title="导出为长图 (Ctrl+Shift+E)">
          <svg viewBox="0 0 16 16" width="16" height="16"><path fill="currentColor" d="M1.75 2.5a.75.75 0 0 0-.75.75v9.5c0 .414.336.75.75.75h12.5a.75.75 0 0 0 .75-.75v-9.5a.75.75 0 0 0-.75-.75H1.75ZM2.5 4h11v5.19l-1.72-1.72a.75.75 0 0 0-1.06 0l-3.22 3.22-2.22-2.22a.75.75 0 0 0-1.06 0L2.5 10.19V4Zm0 8v-.75l2.72-2.72 2.22 2.22a.75.75 0 0 0 1.06 0l3.22-3.22 1.78 1.78V12h-11ZM6 6.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"/></svg>
        </button>
        <button id="btn-pdf" class="tool-btn" title="导出为 PDF (Ctrl+P)">
          <svg viewBox="0 0 16 16" width="16" height="16"><path fill="currentColor" d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14Z"/><path fill="currentColor" d="M7.25 7.689V2a.75.75 0 0 1 1.5 0v5.689l1.97-1.969a.749.749 0 1 1 1.06 1.06l-3.25 3.25a.749.749 0 0 1-1.06 0L4.22 6.78a.749.749 0 1 1 1.06-1.06l1.97 1.969Z"/></svg>
        </button>
      </div>
    </header>
    <div id="progress"><div id="progress-bar"></div></div>

    <div id="main">
      <aside id="sidebar">
        <div class="sidebar-head">
          <div class="sidebar-tabs">
            <button id="tab-toc" class="active">大纲</button>
            <button id="tab-files">文件</button>
          </div>
        </div>
        <nav id="toc"></nav>
        <div id="file-tree" hidden></div>
      </aside>
      <div id="editor-wrap" hidden><textarea id="editor" spellcheck="false"></textarea></div>
      <div id="scroll">
        <article id="content" class="markdown-body" hidden></article>
        <div id="welcome">
          <div class="welcome-logo">
            <svg viewBox="0 0 64 64" width="72" height="72"><rect x="6" y="4" width="52" height="56" rx="8" fill="var(--accent)"/><path d="M16 44V20l8 12 8-12v24" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 36l6 8 6-8M48 20v24" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <h1>MarkView</h1>
          <p class="tagline">安静地阅读 Markdown</p>
          <p class="version" id="welcome-version"></p>
          <button id="btn-welcome-open" class="primary-btn">打开文件</button>
          <p class="hint">或将 Markdown 文件拖入窗口 · Ctrl+O</p>
          <div id="recent-wrap" hidden>
            <div class="recent-head"><span>最近打开</span><button id="btn-clear-recent" class="link-btn">清空</button></div>
            <ul id="recent-list"></ul>
          </div>
          <button id="btn-sample" class="link-btn sample-link">查看示例文档</button>
        </div>
      </div>
    </div>

    <footer id="statusbar">
      <div class="status-left">
        <span id="stat-save"></span>
        <span id="stat-words"></span>
        <span id="stat-time"></span>
        <span id="stat-file" class="status-path"></span>
      </div>
      <div class="status-right">
        <button id="btn-zoom-out" class="status-btn" title="缩小 (Ctrl+-)">−</button>
        <span id="zoom-level" title="缩放比例 (Ctrl+0 重置)">100%</span>
        <button id="btn-zoom-in" class="status-btn" title="放大 (Ctrl+=)">+</button>
      </div>
    </footer>
  </div>

  <div id="search-bar" hidden>
    <div class="search-row">
      <input id="search-input" type="text" placeholder="在文档中查找…" spellcheck="false" />
      <span id="search-count"></span>
      <button id="btn-search-case" class="tool-btn case-btn" title="区分大小写">Aa</button>
      <button id="btn-search-prev" class="tool-btn" title="上一个 (Shift+Enter)">
        <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M3.22 9.78a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0l4.25 4.25a.751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018L8 6.06 4.28 9.78a.75.75 0 0 1-1.06 0Z"/></svg>
      </button>
      <button id="btn-search-next" class="tool-btn" title="下一个 (Enter)">
        <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M12.78 6.22a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L3.22 7.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L8 9.94l3.72-3.72a.75.75 0 0 1 1.06 0Z"/></svg>
      </button>
      <button id="btn-search-close" class="tool-btn" title="关闭 (Esc)">
        <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 1 1 1.06 1.06L9.06 8l3.22 3.22a.749.749 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>
      </button>
    </div>
    <div class="search-row">
      <input id="replace-input" type="text" placeholder="替换为…" spellcheck="false" />
      <button id="btn-replace" class="tool-btn text-btn">替换</button>
      <button id="btn-replace-all" class="tool-btn text-btn">全部替换</button>
    </div>
  </div>

  <div id="float-bar" hidden>
    <button data-fmt="bold" title="加粗"><b>B</b></button>
    <button data-fmt="italic" title="斜体"><i>I</i></button>
    <button data-fmt="strike" title="删除线"><s>S</s></button>
    <button data-fmt="code" title="行内代码"><span style="font-family:Consolas,monospace;font-size:11px">&lt;/&gt;</span></button>
    <span class="fb-sep"></span>
    <button data-fmt="swatch" data-color="#cf222e" class="fb-swatch" style="background:#cf222e" title="红 #cf222e"></button>
    <button data-fmt="swatch" data-color="#bc4c00" class="fb-swatch" style="background:#bc4c00" title="橙 #bc4c00"></button>
    <button data-fmt="swatch" data-color="#9a6700" class="fb-swatch" style="background:#9a6700" title="黄 #9a6700"></button>
    <button data-fmt="swatch" data-color="#1a7f37" class="fb-swatch" style="background:#1a7f37" title="绿 #1a7f37"></button>
    <button data-fmt="swatch" data-color="#0969da" class="fb-swatch" style="background:#0969da" title="蓝 #0969da"></button>
    <button data-fmt="swatch" data-color="#8250df" class="fb-swatch" style="background:#8250df" title="紫 #8250df"></button>
    <button data-fmt="swatch" data-color="#656d76" class="fb-swatch" style="background:#656d76" title="灰 #656d76"></button>
    <button data-fmt="color" title="更多颜色 / 自定义 / 取色笔"><span class="fb-color">A</span></button>
    <span class="fb-sep"></span>
    <button data-fmt="link" title="插入链接">
      <svg viewBox="0 0 16 16" width="13" height="13"><path fill="currentColor" d="M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 .75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"/></svg>
    </button>
    <button data-fmt="clear" title="清除格式">
      <svg viewBox="0 0 16 16" width="13" height="13"><path fill="currentColor" d="M8.5 2.5 13 7l-5.5 5.5H4L2.5 11 8.5 2.5Zm1.06 1.06L5 8.12l2.38 2.38 4.56-4.56-2.38-2.38ZM2 13.5h12v1H2v-1Z"/></svg>
    </button>
  </div>

  <div id="typo-modal" class="link-modal" hidden>
    <div class="link-card typo-card">
      <h3>字体与排版</h3>
      <label>正文字号 <span id="typo-size-val">17px</span></label>
      <input id="typo-size" type="range" min="14" max="24" step="1" value="17" />
      <label>行高 <span id="typo-lh-val">1.80</span></label>
      <input id="typo-lh" type="range" min="1.4" max="2.4" step="0.05" value="1.8" />
      <label>段距 <span id="typo-ps-val">1.0</span></label>
      <input id="typo-ps" type="range" min="0.5" max="2" step="0.1" value="1" />
      <div class="link-btns">
        <button id="typo-reset">恢复默认</button>
        <button id="typo-close" class="primary">完成</button>
      </div>
    </div>
  </div>

  <div id="lightbox" hidden>
    <div id="lightbox-bar">
      <button id="lb-out" title="缩小">−</button>
      <span id="lb-zoom-label">100%</span>
      <button id="lb-in" title="放大">+</button>
      <button id="lb-reset" title="重置">1:1</button>
    </div>
    <img id="lightbox-img" alt="" />
  </div>
  <div id="drop-overlay" hidden><div>释放以打开 Markdown 文件</div></div>
  <div id="toast" hidden></div>

  <script src="../../dist/renderer.js"></script>
</body>
</html>
